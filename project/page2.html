<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Verify Certificate</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script type="module" src="verify.js"></script>
  </head>
  <body>
    <nav>
      <a href="/"><i class="fas fa-home"></i> Home</a>
      <a href="/page2.html" aria-current="page"><i class="fas fa-certificate"></i> Verify Certificate</a>
    </nav>
    <main>
      <h1><i class="fas fa-shield-alt"></i> Certificate Verification</h1>
      
      <div class="verification-form">
        <div class="form-group">
          <label for="certificate-hash"><i class="fas fa-fingerprint"></i> Certificate Hash:</label>
          <input type="text" id="certificate-hash" placeholder="Enter certificate hash">
        </div>
        <button id="verify-btn"><i class="fas fa-search"></i> Verify Certificate</button>
      </div>
      
      <div id="verification-result" class="hidden">
        <h2><i class="fas fa-clipboard-check"></i> Verification Result</h2>
        <div id="result-status"></div>
        
        <div id="certificate-details" class="hidden">
          <h3>Certificate Details</h3>
          <div class="certificate">
            <h3>Certificate of Completion</h3>
            <p>This is to certify that</p>
            <p class="cert-name" id="verify-name"></p>
            <p>has successfully completed the course</p>
            <p class="cert-course" id="verify-course"></p>
            <p>with a grade of <span id="verify-grade"></span></p>
            <p>Date: <span id="verify-date"></span></p>
            <div class="cert-hash">
              <p><i class="fas fa-fingerprint"></i> Certificate Hash:</p>
              <p id="verify-hash" class="hash-value"></p>
            </div>
            <div class="blockchain-details">
              <p><i class="fas fa-cube"></i> Block Number: <span id="block-number"></span></p>
              <p><i class="fas fa-clock"></i> Timestamp: <span id="block-timestamp"></span></p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
